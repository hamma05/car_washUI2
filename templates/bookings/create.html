{% extends 'base.html' %}
{% load static %}
{% block title %}Réserver — HBIBWASH{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'assets/index.css' %}">
<style>
.step-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
</style>
{% endblock %}

{% block content %}
<main class="flex-grow pt-20 pb-xl w-full relative">
    <div id="booking-app" data-services="{{ services_json|escape }}" data-csrf="{{ csrf_token }}" class="relative min-h-[85vh]">
        <div class="py-lg text-center text-body-md text-on-surface-variant">
            Chargement du formulaire de réservation...
        </div>
    </div>
</main>
{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'js/index-bundle.js' %}"></script>
{% endblock %}
